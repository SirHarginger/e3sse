[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e3sse"
version = "0.1.0"
description = "Softening-Rescaled Transport and conformal screening of Li-ion solid electrolytes."
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = [".agents"]
