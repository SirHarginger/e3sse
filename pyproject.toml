[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e3sse"
version = "0.1.0"
description = "Softening-Rescaled Transport and conformal screening of Li-ion solid electrolytes."
requires-python = ">=3.10"

dependencies = [
    "ase",
    "numpy",
    "pandas",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]
# Study-1 publication figures (scripts/plot_study1_figures.py).
figures = [
    "matplotlib",
    "seaborn==0.13.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint.per-file-ignores]
# The audit must isolate any per-file parser failure and report it, whatever its type.
"src/e3sse/data/dataset_audit.py" = ["BLE001"]
"src/e3sse/data/litraj_provenance.py" = ["BLE001"]
"src/e3sse/data/mplitrj_provenance.py" = ["BLE001"]
"src/e3sse/data/fpmd_aiida_inventory.py" = ["BLE001"]
"scripts/audit_fpmd_aiida.py" = ["BLE001"]
# A shard failure of any type is recorded and its siblings continue; never a result.
"src/e3sse/execution/sharded_execution.py" = ["BLE001"]
# A model failure on one frame is that frame's recorded scientific status.
"src/e3sse/softening/study1_inference.py" = ["BLE001"]
# A benchmark worker reports any failure (even BaseException) to its parent as infrastructure.
"src/e3sse/execution/workload_benchmark.py" = ["BLE001"]
# An unexpected stage crash becomes a recorded infrastructure outcome with its traceback.
"src/e3sse/production/orchestrator.py" = ["BLE001"]
# Any shard-run failure is written to the run record before it is re-raised.
"scripts/run_study1_softening_atlas.py" = ["BLE001"]
# Pre-existing acquisition script, outside Gate G0 scope; not restyled here.
"scripts/fetch_data.py" = ["BLE001", "C408", "UP024"]
