[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e3sse"
version = "0.1.0"
description = "Softening-Rescaled Transport and conformal screening of Li-ion solid electrolytes."
requires-python = ">=3.10"

dependencies = [
    "ase",
    "numpy",
    "pandas",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint.per-file-ignores]
# The audit must isolate any per-file parser failure and report it, whatever its type.
"src/e3sse/data/dataset_audit.py" = ["BLE001"]
"src/e3sse/data/litraj_provenance.py" = ["BLE001"]
"src/e3sse/data/mplitrj_provenance.py" = ["BLE001"]
# Pre-existing acquisition script, outside Gate G0 scope; not restyled here.
"scripts/fetch_data.py" = ["BLE001", "C408", "UP024"]
